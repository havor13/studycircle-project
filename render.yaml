services:
  # --- Django Backend ---
  - type: web
    name: studycircle-backend
    env: python
    plan: free
    rootDir: studycircle
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn studycircle.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: studycircle.settings
      - key: SECRET_KEY
        value: your_secret_key_here
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: studycircle-db
          property: connectionString

  # --- React Frontend ---
  - type: static
    name: studycircle-frontend
    rootDir: studycircle-frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        value: https://studycircle-backend.onrender.com/api/

databases:
  - name: studycircle-db
    plan: free
